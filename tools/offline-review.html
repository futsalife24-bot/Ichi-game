<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>オフライン動作の確認</title>
<style>
body{margin:16px;background:#edf3ea;color:#243324;font:16px sans-serif}
button{padding:10px;margin:4px} pre{white-space:pre-wrap;background:white;padding:12px;border-radius:10px}
iframe{display:block;width:844px;height:390px;border:2px solid #789;margin-top:12px}
</style>
<h1>オフライン動作の確認</h1>
<p>確認用サーバー（127.0.0.1:5193）専用。公開版とは別の保存先を使い、架空データ作成時は既存の確認記録を上書きしません。</p>
<button id="fixture">架空の確認データを用意</button>
<button id="prepare">オフライン準備を確認</button>
<button id="voices" disabled>音声698個の取得・デコードを確認</button>
<button id="listen" disabled>確認音声を再生</button>
<pre id="result" role="status">準備中</pre>
<p id="audioResult" role="status"></p>
<iframe id="gameFrame" title="オフラインのゲーム確認" allow="fullscreen 'none'"></iframe>
<script type="module">
import {freshSave} from '../src/save.js';
const $=id=>document.getElementById(id);
const allowed=location.hostname==='127.0.0.1'&&location.port==='5193';
const root=new URL('../',location.href),key='kirakira-island-profiles-v3';
let cacheName,sample,context;
const report=value=>{$('result').textContent=typeof value==='string'?value:JSON.stringify(value,null,2)};
if(!allowed){document.querySelectorAll('button').forEach(b=>b.disabled=true);report('確認用サーバーで開いてください。');}
else{$('gameFrame').src=new URL('index.html?hour=12&weather=sun',root);report('架空のデータを用意し、準備が完了してからサーバーを停止してください。');}
$('fixture').onclick=()=>{
  if(!allowed)return;
  if(localStorage.getItem(key)!==null){report('既存の確認記録は上書きしません。');return;}
  const game=freshSave();game.stars=47;game.voice=true;game.bgm=false;
  game.avatar={color:'pink',ears:'usagi',eyes:'maru',pattern:'nashi',tail:'maru',name:''};
  game.closet=['cap','silk','kinokohat','megane','sangurasu','tshirt','border','dress','overall','raincoat','yukata'];
  game.outfit={hat:'ribbon',face:'megane',body:'dress'};
  localStorage.setItem(key,JSON.stringify({schemaVersion:3,legacyAssigned:false,activeProfileId:'offline-check',profiles:[{id:'offline-check',label:'オフライン確認',icon:'🐰',game}]}));
  $('gameFrame').src=new URL('index.html?hour=12&weather=sun',root);
  report('架空の確認データを用意しました。');
};
$('prepare').onclick=async()=>{
  if(!allowed)return;
  $('prepare').disabled=true;report('ゲームと全音声の保存完了を待っています。');
  try{
    await navigator.serviceWorker.register(new URL('sw.js',root));
    await navigator.serviceWorker.ready;
    if(!navigator.serviceWorker.controller)await new Promise(resolve=>navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true}));
    const sw=await(await fetch(new URL('sw.js',root))).text();
    cacheName=sw.match(/const VERSION = '([^']+)'/)[1];
    const cache=await caches.open(cacheName);
    const assets=[...sw.match(/const ASSETS = \[([\s\S]*?)\];/)[1].matchAll(/'([^']+)'/g)].map(m=>m[1]);
    const idx=await(await cache.match(new URL('voice/index.json',root))).json();
    const voices=Object.values(idx.clips);
    const missing=[];
    for(const path of [...assets,...voices.map(c=>'./voice/'+c.file)])if(!await cache.match(new URL(path,root)))missing.push(path);
    if(missing.length)throw Error('保存されていないファイル: '+missing.join(', '));
    // この かくにんページも、サーバーを とめたあとに よみなおせるようにする。
    await cache.put(location.href,await fetch(location.href));
    $('voices').disabled=false;
    report({段階:'準備完了',キャッシュ:cacheName,ゲーム用ファイル:assets.length,音声:voices.length,欠落:0,操作:'確認用サーバーを停止してから、このページを再読み込みしてください。'});
  }catch(error){report('準備失敗: '+error.message);}
  finally{$('prepare').disabled=false;}
};
$('voices').onclick=async()=>{
  if(!allowed)return;
  $('voices').disabled=true;report('配信元停止後の全音声を確認しています。');
  let fetched=0,decoded=0;const errors=[];
  try{
    context??=new AudioContext();await context.resume();
    const idx=await(await fetch(new URL('voice/index.json',root))).json();
    const clips=Object.values(idx.clips);
    for(const clip of clips){
      try{
        const response=await fetch(new URL('voice/'+clip.file,root));
        if(!response.ok||!response.headers.get('content-type')?.includes('audio/'))throw Error('音声として取得できません');
        const bytes=await response.arrayBuffer();fetched++;
        const buffer=await context.decodeAudioData(bytes);
        if(buffer.duration<=0)throw Error('音声の長さがありません');
        decoded++;
        if(clip.text.includes('きせかえ'))sample={buffer,text:clip.text};
      }catch(error){errors.push({音声:clip.file,理由:error.message});}
    }
    $('listen').disabled=!sample;
    report({段階:'配信元停止後の音声確認',対象:clips.length,取得:fetched,デコード:decoded,失敗:errors.length,詳細:errors});
  }catch(error){report('確認失敗: '+error.message);}
  finally{$('voices').disabled=false;}
};
$('listen').onclick=async()=>{
  if(!allowed||!sample)return;
  await context.resume();const source=context.createBufferSource();source.buffer=sample.buffer;source.connect(context.destination);
  $('audioResult').textContent='再生中: '+sample.text;
  source.onended=()=>{$('audioResult').textContent='再生完了: '+sample.text;};source.start();
};
// かくにんページを よみなおしたあとも、すでに ほぞんした こえを ためせる。
if(allowed&&navigator.serviceWorker.controller){$('voices').disabled=false;}
</script>
</html>
