<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８島の景観確認</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
<style>html,body{margin:0;height:100%;background:#c6e3e9;font-family:system-ui}canvas{display:block;width:100%;height:100%}nav{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #adc8c4;border-radius:12px;padding:8px 12px;background:#fff9ed;color:#264c4b;font:inherit}#note{position:absolute;bottom:12px;left:16px;background:#fff9eddd;padding:8px 16px;border-radius:10px;color:#264c4b}.clean nav,.clean #note{display:none}</style></head>
<body><canvas id="game"></canvas><nav id="tools"></nav><div id="note">島を読み込んでいます</div>
<script>
// よみこみの どこで とまったかを、がめんから たしかめる。
const showLoadError=message=>document.getElementById('note').textContent=`読み込みエラー: ${message}`;
window.addEventListener('error',event=>showLoadError(event.message||'素材を読み込めませんでした'));
window.addEventListener('unhandledrejection',event=>showLoadError(event.reason?.message||String(event.reason)));
</script>
<script type="module" src="./concept-review.js"></script></body></html>
