name: Voice checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 制作基準とパーツ台帳を確認
        run: node tools/island-content-docs.mjs --check
      - run: node --import ./tools/register.mjs --test tools/island-balance.test.mjs tools/island-learning.test.mjs tools/tutorial-island.test.mjs
      - name: 八島の活動と景観素材を確認
        run: node --import ./tools/register.mjs --test tools/island-activities.test.mjs tools/learning-island-scene.test.mjs tools/island-assets.test.mjs
      - run: node --import ./tools/register.mjs --test tools/adventure.test.mjs tools/developer-mode.test.mjs
      - run: node --import ./tools/register.mjs --test tools/harbor-errands-state.test.mjs tools/harbor-errands.test.mjs
      - run: node --import ./tools/register.mjs --test tools/harbor-gathering-state.test.mjs tools/harbor-gathering.test.mjs
      - run: node --import ./tools/register.mjs --test tools/adaptive-play.test.mjs tools/adaptive-integration.test.mjs tools/island-guidance.test.mjs tools/island-guidance-integration.test.mjs
      - run: node --import ./tools/register.mjs --test tools/forest-layout.test.mjs tools/forest-route.test.mjs
      - run: node --import ./tools/register.mjs --test tools/harbor-layout.test.mjs tools/harbor-effects.test.mjs tools/harbor-play.test.mjs tools/harbor-visibility.test.mjs tools/harbor-integration.test.mjs tools/harbor-paving.test.mjs
      - run: node assets-src/forest/validate-assets.mjs
      - run: node assets-src/harbor/validate-assets.mjs
      - run: node --import ./tools/register.mjs --test tools/help-picnic.test.mjs tools/closet-preview.test.mjs tools/birthday.test.mjs tools/suggestions.test.mjs tools/play-time.test.mjs tools/play-settings.test.mjs tools/observations.test.mjs tools/observation-integration.test.mjs tools/profiles.test.mjs tools/profile-ui.test.mjs tools/help-save.test.mjs tools/help-integration.test.mjs tools/plan-voice.test.mjs tools/voice.test.mjs tools/sw.test.mjs
      - run: node --import ./tools/register.mjs --test tools/voice-release-check.test.mjs
      - run: node --import ./tools/register.mjs tools/finalize-voice.mjs --check-release
