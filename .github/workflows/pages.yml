name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 制作基準とパーツ台帳を確認
        run: node tools/island-content-docs.mjs --check
      - name: 島別の配信素材を照合
        run: node tools/pack-concept-islands.mjs --check
      - run: node --import ./tools/register.mjs --test tools/island-balance.test.mjs tools/island-learning.test.mjs tools/tutorial-island.test.mjs tools/invitation-quest.test.mjs tools/growth-controls.test.mjs tools/jump-discovery.test.mjs tools/world-activity.test.mjs tools/world-activity-walk.test.mjs
      - name: 八島の活動と景観素材を確認
        run: node --import ./tools/register.mjs --test tools/island-activities.test.mjs tools/learning-island-scene.test.mjs tools/island-assets.test.mjs tools/concept-assets.test.mjs tools/concept-camera.test.mjs tools/concept-route.test.mjs tools/concept-world.test.mjs tools/concept-walk.test.mjs tools/concept-avatar-visibility.test.mjs tools/concept-sky-clouds.test.mjs tools/concept-festival-detail.test.mjs
      - name: あそびのおさそいと開発者モードを確認
        run: node --import ./tools/register.mjs --test tools/learning-invitation.test.mjs tools/learning-invitation-world.test.mjs tools/learning-invitation-main.test.mjs tools/developer-mode.test.mjs
      - name: 第三島の読込と訪問導線を確認
        run: node --import ./tools/register.mjs --test tools/forest-concept-load.test.mjs tools/island-guidance-integration.test.mjs
      - name: 全音声と旧段階公開の保護を検査
        run: |
          node --import ./tools/register.mjs --test tools/voice-release-check.test.mjs
          node --import ./tools/register.mjs --test tools/adventure.test.mjs
          node --import ./tools/register.mjs --test tools/harbor-gathering-state.test.mjs tools/harbor-gathering.test.mjs
          node --import ./tools/register.mjs --test tools/birthday.test.mjs tools/suggestions.test.mjs tools/play-time.test.mjs tools/play-settings.test.mjs tools/observations.test.mjs tools/observation-integration.test.mjs tools/profiles.test.mjs tools/profile-ui.test.mjs tools/help-save.test.mjs tools/help-integration.test.mjs tools/plan-voice.test.mjs tools/voice.test.mjs tools/sw.test.mjs
          node --import ./tools/register.mjs tools/finalize-voice.mjs --check
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html style.css manifest.webmanifest sw.js src vendor icons _site/
          mkdir -p _site/assets/forest
          cp assets/forest/woodland-kit.json _site/assets/forest/
          mkdir -p _site/assets/harbor
          cp assets/harbor/harbor-kit.json _site/assets/harbor/
          mkdir -p _site/assets/islands
          cp assets/islands/learning-kit.json assets/islands/learning-kit-attachments.json assets/islands/concept-?.json assets/islands/concept-nature.json _site/assets/islands/
          mkdir -p _site/voice/gemini
          cp voice/index.json _site/voice/
          cp voice/gemini/*.mp3 _site/voice/gemini/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
