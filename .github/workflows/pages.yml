name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate voice release
        run: |
          node --import ./tools/register.mjs --test tools/birthday.test.mjs tools/suggestions.test.mjs tools/play-time.test.mjs tools/play-settings.test.mjs tools/observations.test.mjs tools/observation-integration.test.mjs tools/profiles.test.mjs tools/profile-ui.test.mjs tools/help-save.test.mjs tools/help-integration.test.mjs tools/plan-voice.test.mjs tools/voice.test.mjs tools/sw.test.mjs
          node --import ./tools/register.mjs tools/finalize-voice.mjs --check
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html style.css manifest.webmanifest sw.js src vendor icons _site/
          mkdir -p _site/voice/gemini
          cp voice/index.json _site/voice/
          cp voice/gemini/*.mp3 _site/voice/gemini/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
