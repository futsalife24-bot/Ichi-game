<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>キラキラ アイランド</title>
  <meta name="description" content="3Dの しまで どうぶつたちと あそびながら いろ・かず・かたち・もじを おぼえる ちいくゲーム">
  <meta name="theme-color" content="#6ec6ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="キラキラ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="pills">
      <div id="stars" class="pill"><span class="star">⭐</span><span id="starCount">0</span></div>
      <div id="bells" class="pill small"><span>🔔</span><span id="bellCount">0</span><span class="seed">🌱</span><span id="seedCount">0</span></div>
      <div id="clock" class="pill small"></div>
    </div>

    <button id="questCard" class="hidden" aria-label="もういちど きく">
      <div id="questIcon"></div>
      <div class="quest-body">
        <div id="questText"></div>
        <div id="questProgress"></div>
      </div>
      <div class="quest-ear">🔊</div>
    </button>

    <div id="settings">
      <button id="btnBgm" class="round-btn" aria-label="おんがく">🎵</button>
      <button id="btnVoice" class="round-btn" aria-label="こえ">🗣️</button>
      <button id="btnHome" class="round-btn" aria-label="タイトルへ">🏠</button>
    </div>

    <div id="sideBtns">
      <button id="btnZukan" class="side-btn" aria-label="ずかん"><span class="side-emoji">📖</span><span class="side-label">ずかん</span><span class="badge hidden">!</span></button>
      <button id="btnCloset" class="side-btn" aria-label="きせかえ"><span class="side-emoji">👕</span><span class="side-label">きせかえ</span></button>
    </div>
    <div id="tray" class="hidden"></div>
    <div id="furnBar" class="hidden">
      <button data-act="rotate"><span class="fb-emoji">🔄</span><span>まわす</span></button>
      <button data-act="put"><span class="fb-emoji">📦</span><span>しまう</span></button>
      <button data-act="done"><span class="fb-emoji">✅</span><span>できた</span></button>
    </div>

    <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
    <button id="btnJump" aria-label="ジャンプ"><span class="jump-icon">⤴</span><span>ジャンプ</span></button>
    <div id="helpActions" class="hidden"><button id="helpGo">🍎 いっしょに さがす</button><button id="helpWalk">🌳 あとで つづける</button></div>
    <button id="helpReturn" class="hidden">🐥 おてつだい</button>
    <button id="helpQuiz" class="hidden">🎈 みつける あそび</button>

    <div id="subtitle"><div id="subName"></div><div id="subText"></div></div>
    <div id="itemPop"><div class="item-new">NEW!</div><div class="item-emoji"></div><div class="item-name"></div></div>
    <div id="bigPop"></div>
    <div id="numPop"></div>
    <div id="reward"><div class="reward-title">ごほうび！</div><div class="reward-emoji"></div><div class="reward-name"></div></div>
  </div>

  <div id="panel" class="hidden">
    <div class="sheet">
      <div class="sheet-head"><span id="panelTitle"></span><span id="panelCount"></span><button id="panelClose" aria-label="とじる">✖</button></div>
      <div id="panelTabs"></div>
      <div id="panelGrid"></div>
    </div>
  </div>

  <div id="fade"></div>

  <div id="title" class="screen">
    <h1 class="logo"><span>キ</span><span>ラ</span><span>キ</span><span>ラ</span><br><span>ア</span><span>イ</span><span>ラ</span><span>ン</span><span>ド</span></h1>
    <p id="titleStars"></p>
    <div class="title-actions">
      <button id="btnPlay" class="play-btn"></button>
      <button id="btnQuickPlay" class="remake-btn">🐰 このこで すぐ あそぶ</button>
      <button id="btnRemake" class="remake-btn">✏️ つくりなおす</button>
    </div>
    <p class="parents">おうちの かたへ：よこむき で あそびます。おとが でます。</p>
    <p class="credit">こえ：Google Gemini 3.8 Flash TTS / Cleo</p>
    <div class="parent-actions">
      <button id="btnProfiles" class="remake-btn">あそぶこを えらぶ</button>
      <button id="btnSave" class="remake-btn">おうちの かたへ：きろくの ほぞん</button>
    </div>
  </div>

  <div id="helpPanel" class="hidden help-panel" role="dialog" aria-modal="true" aria-labelledby="helpHeading">
    <section class="help-sheet">
      <h2 id="helpHeading"></h2>
      <div id="helpPicture" class="help-picture" aria-hidden="true"></div>
      <p id="helpMessage"></p>
      <div class="help-choices">
        <button id="helpAccept">🍎 おてつだい する</button>
        <button id="helpAgain" class="hidden">🐥 もういちど おてつだい</button>
        <button id="helpFree">🌳 じゆうに あそぶ</button>
      </div>
    </section>
  </div>
  <div id="profilePanel" class="hidden help-panel" role="dialog" aria-modal="true" aria-labelledby="profileHeading">
    <section class="help-sheet">
      <h2 id="profileHeading">あそぶこを えらぼう</h2>
      <p id="profileMessage"></p>
      <button id="profileExport" type="button">引き継ぎ前の記録をファイルに保存</button>
      <div id="profileList" class="help-choices"></div>
      <details id="profileAdd">
        <summary>おうちの方へ：子どもの記録を追加</summary>
        <form id="profileForm">
          <label>絵 <select id="profileIcon" aria-label="プロフィールの絵"></select></label>
          <label>呼び名（本名は不要）<input id="profileLabel" maxlength="20" required autocomplete="off"></label>
          <p>別の子は新しい記録から始まります。この入口は本人確認機能ではありません。</p>
          <button id="profileCreate" type="submit">この子の記録を作る</button>
        </form>
      </details>
      <button id="profileClose" type="button">もどる</button>
    </section>
  </div>
  <div id="savePanel" class="hidden help-panel" role="dialog" aria-modal="true" aria-labelledby="saveHeading">
    <section class="help-sheet">
      <h2 id="saveHeading">おうちの かたへ：記録の保護</h2>
      <p id="saveMessage"></p>
      <div class="help-choices">
        <button id="saveExport">記録をファイルに保存</button>
        <button id="saveRestore">直前の記録に戻す</button>
        <button id="saveReload">画面を読み直す</button>
        <button id="saveClose">とじる</button>
      </div>
    </section>
  </div>

  <div id="maker" class="hidden">
    <div class="maker-panel">
      <div id="makerDots"></div>
      <h2 id="makerTitle"></h2>
      <div id="makerBody"></div>
      <div class="maker-nav">
        <button id="makerBack">◀ もどる</button>
        <button id="makerRandom">🎲 おまかせ</button>
        <button id="makerNext">つぎへ ▶</button>
      </div>
    </div>
  </div>

  <div id="rotate" class="screen">
    <div class="rotate-icon">📱</div>
    <p>よこに してね</p>
  </div>

  <noscript>JavaScript を オンに してね</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
